<!DOCTYPE html>
<html>
<head>
    <title>ShopEase - Register</title>
    <link rel="stylesheet" href="style.css">

    <!-- External JavaScript file -->
    <script src="script.js"></script>
</head>

<body class="center-page">

<div class="box">
    <h2>Create Account</h2>
    <p>Register to ShopEase</p>

    <label>Name</label><br>
    <input type="text" id="name" placeholder="Enter Name"><br>

    <label>Password</label><br>
    <input type="password" id="password" placeholder="Enter Password"><br>

    <label>Email</label><br>
    <input type="text" id="email" placeholder="Enter Email"><br>

    <label>Phone</label><br>
    <input type="text" id="phone" placeholder="Enter Phone Number"><br><br>

    <button onclick="return validateForm()">Register</button>

    <p class="note">Already registered? Go to Login</p>
</div>

</body>
</html>
