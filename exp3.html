<!DOCTYPE html>
<html>
<head>
<title>Experiment 3 - CSS Position & Cursor</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="center-page">

<div class="exp-box">

<h2>Experiment 3 – CSS Position & Cursor Demo</h2>

<!-- (a) Cursor -->
<h3>1. Cursor Styles</h3>
<button class="cursor-pointer">Pointer</button>
<button class="cursor-move">Move</button>
<button class="cursor-text">Text</button>
<button class="cursor-wait">Wait</button>

<hr>

<!-- (b) Position relative & absolute -->
<h3>2. Relative & Absolute Position</h3>
<div class="relative-box">
  Relative Box
  <div class="absolute-box">Absolute</div>
</div>

<hr>

<!-- (c) Fixed position -->
<h3>3. Fixed Position (Cart Icon)</h3>
<p>Scroll page. Cart icon stays fixed.</p>

<div class="fixed-cart">🛒</div>

<hr>

<!-- (d) Overlapping -->
<h3>4. Overlapping using Z-index</h3>
<div class="overlap-area">
  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
</div>

</div>

</body>
</html>
