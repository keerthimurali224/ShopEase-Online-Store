<script>
const logo = document.getElementById("dragLogo");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

logo.addEventListener("mousedown", function(e){
    isDragging = true;
    offsetX = e.clientX - logo.offsetLeft;
    offsetY = e.clientY - logo.offsetTop;
    logo.style.position = "absolute";
});

document.addEventListener("mousemove", function(e){
    if(isDragging){
        logo.style.left = (e.clientX - offsetX) + "px";
        logo.style.top = (e.clientY - offsetY) + "px";
    }
});

document.addEventListener("mouseup", function(){
    isDragging = false;
});
</script>
<div id="cursorBox">X: 0 , Y: 0</div>
<script>
document.addEventListener("mousemove", function(e){
    let x = e.clientX;
    let y = e.clientY;

    document.getElementById("cursorBox").innerText = 
    "X: " + x + " , Y: " + y;
});
</script>
